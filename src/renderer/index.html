<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <title>Encrypted Chat App</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <script>console.log('HTML file loaded');</script>
<body>
    <div id="app">
        <div id="login-container">
            <h1>Encrypted Chat</h1>
            <div id="status"></div>
            <button id="init-btn">Initialize Chat</button>
        </div>

        <div id="chat-container" style="display: none;">
            <div id="header">
                <h2>Encrypted Chat</h2>
                <div id="connection-status">Disconnected</div>
                <button id="settings-btn" style="margin-left: auto; background: none; border: none; color: #95a5a6; font-size: 1.5rem; cursor: pointer;">⚙️</button>
            </div>

            
            <div id="main-chat">
                <div id="messages-container">
                    <!-- Messages will be displayed here -->
                </div>
                <div id="input-area">
                    <input type="text" id="message-input" placeholder="Type a message..." />
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./index.js" type="module"></script>

<!-- User ID Settings Modal -->
<div id="userID-settings-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Change User ID</h3>
            <span class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <p>Enter your new user ID:</p>
            <input type="text" id="new-userID-input" placeholder="New user ID" maxlength="20" />
            <div id="userID-settings-error" class="error-message" style="display: none; color: #e74c3c; margin-top: 10px;"></div>
        </div>
        <div class="modal-footer">
            <button id="cancel-userID-btn" class="btn">Cancel</button>
            <button id="save-userID-btn" class="btn btn-primary">Save</button>
        </div>
    </div>
</div>
</body>
</html>
